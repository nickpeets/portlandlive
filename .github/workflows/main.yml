name: Refresh listings
"on":
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
# One refresh at a time: a second run queues behind the first instead of
# racing it to push (run #292 lost a rebase on the generated files, Oct 28).
concurrency:
  group: refresh-listings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests beautifulsoup4 python-dateutil playwright curl_cffi pillow
      # Headless-browser tier for the two bot-walled venues (Goodfoot, Music
      # Millennium). Chromium + its system libs; ~1 min. Only sources flagged
      # walled use it -- the other 34 stay on plain requests. If this step
      # fails, the walled venues WARN and skip; the rest of the scrape is
      # unaffected (continue-on-error below already covers that).
      - name: Install headless Chromium
        continue-on-error: true
        run: python3 -m playwright install chromium --with-deps
      - name: Scrape venue calendars
        continue-on-error: true
        run: python3 scrape_venues.py
      - name: Build shows.json
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          IMPACT_FTP_USER: ${{ secrets.IMPACT_FTP_USER }}
          IMPACT_FTP_PASS: ${{ secrets.IMPACT_FTP_PASS }}
        run: python3 build_shows.py
      - name: Commit if changed
        run: |
          git config user.name "portlandlive-bot"
          git config user.email "bot@portlandlive.local"
          git add shows.json manual_shows.json venue_baselines.json archive.json show venue festival sitemap.xml news.json og
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "Refresh listings $(date -u +%F)"
          pushed=0
          for i in 1 2 3; do
            # -X theirs: on a clash in a generated file this build's copy wins
            # (the commit only touches generated files, never code).
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"; sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::push failed after 3 attempts - listings NOT published"
            exit 1
          fi
