<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Not here — Rain Or Shows</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#2f5a4a;color:#f3ead7;font-family:Georgia,'Bitter',serif;text-align:center;padding:24px}
h1{font-family:'Oswald',Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:28px;margin:0 0 10px}p{margin:0 0 18px;opacity:.85;line-height:1.5}
a{display:inline-block;background:#b5562b;color:#f3ead7;text-decoration:none;font-family:'Oswald',Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:6px}</style></head>
<body><div><h1>That page isn&rsquo;t here</h1><p>The show may have passed, or the link is off by a letter.</p><a href="/">Tonight&rsquo;s shows</a></div>
<script>
  // A dropped show page is the common case. Send it into the app so a
  // search for the venue or act is one tap away.
  if(/\/show\//.test(location.pathname)){ document.querySelector('a').href = '/#/venues'; document.querySelector('a').textContent = 'Browse venues'; }
</script></body></html>
